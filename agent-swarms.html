<style>

  *{box-sizing:border-box}

  #viewport{position:fixed;inset:0;transition:right .22s ease}

  #stage{position:absolute;left:50%;top:50%;width:var(--stage-w);height:var(--stage-h);
    transform-origin:center center;background:var(--bg);overflow:hidden;
    box-shadow:0 24px 80px rgba(0,0,0,.6)}

  .slide.on{display:block}
  .el{position:absolute}
  .el.text{display:flex;white-space:normal;overflow-wrap:anywhere}
  .el.text>span{display:block;width:100%}
  .el.text.v-top{align-items:flex-start}
  .el.text.v-middle{align-items:center}
  .el.text.v-bottom{align-items:flex-end}

  /* chrome */
  #bar{position:fixed;left:0;right:0;bottom:0;height:2px;background:var(--rule);z-index:40}
  #bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s ease}
  #hud{position:fixed;right:14px;bottom:14px;font-size:12px;color:#4A5157;z-index:40;
    font-variant-numeric:tabular-nums;user-select:none}
  #hint{position:fixed;left:14px;bottom:12px;font-size:11px;color:#3A4045;z-index:40;
    transition:opacity .4s ease;user-select:none}
  #hint.fade{opacity:0}

  /* notes */
  #notes{position:fixed;right:0;top:0;bottom:0;width:380px;background:var(--panel);
    border-left:1px solid var(--rule);padding:22px 22px 30px;overflow-y:auto;z-index:50;
    transform:translateX(100%);transition:transform .22s ease;font-size:14px;line-height:1.55}
  #notes.open{transform:none}
  #notes h4{margin:0 0 4px;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;
    color:var(--accent);font-weight:700}
  #notes .nm{color:var(--dim);font-size:12px;margin-bottom:16px}
  #notes pre{white-space:pre-wrap;font-family:inherit;margin:0;color:var(--ink)}
  #notes .nx{margin-top:24px;padding-top:14px;border-top:1px solid var(--rule);
    color:var(--faint);font-size:12px}

  /* overview */
  #grid{position:fixed;inset:0;background:#07090A;z-index:60;display:none;
    grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px;padding:22px;
    overflow-y:auto;align-content:start}
  #grid.open{display:grid}
  .thumb{position:relative;aspect-ratio:16/9;background:var(--bg);border:1px solid var(--rule);
    border-radius:4px;overflow:hidden;cursor:pointer}
  .thumb.cur{border-color:var(--accent)}
  .thumb>.inner{position:absolute;top:0;left:0;width:1280px;height:720px;
    transform-origin:top left;pointer-events:none}
  .thumb>b{position:absolute;left:6px;bottom:4px;font-size:10px;color:var(--faint);
    font-weight:600;z-index:2;background:rgba(15,18,20,.8);padding:1px 5px;border-radius:3px}

  @media print{
    html,body{overflow:visible;background:#fff}
    #viewport{position:static;display:block}
    #stage{display:none}
    #bar,#hud,#hint,#notes,#grid{display:none!important}
    #print{display:block!important}
    .page{position:relative;width:1280px;height:720px;background:var(--bg);
      overflow:hidden;page-break-after:always;break-after:page}
    @page{size:1280px 720px;margin:0}
  }
  #print{display:none}
</style>
