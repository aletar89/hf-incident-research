  "use strict";
  var doc = JSON.parse(document.getElementById('doc').textContent);
  var SL = doc.slides, N = SL.length;
  var W = (doc.size&&doc.size.width)||1280, H = (doc.size&&doc.size.height)||720;
  var stage = document.getElementById('stage');
  document.documentElement.style.setProperty('--stage-w', W+'px');
  document.documentElement.style.setProperty('--stage-h', H+'px');

  /* ---------- element rendering ---------- */
  function build(el){
    var d = document.createElement('div');
    d.className = 'el ' + el.type;
    var s = d.style;
    s.left = el.x+'px'; s.top = el.y+'px';
    s.width = el.w+'px'; s.height = el.h+'px';
    if (el.opacity != null && el.opacity !== 1) s.opacity = el.opacity;
    if (el.rotation) s.transform = 'rotate('+el.rotation+'deg)';
    if (el.morphId) d.dataset.morph = el.morphId;

    if (el.type === 'text'){
      d.classList.add('v-' + (el.valign || 'top'));
      s.fontSize = el.fontSize+'px';
      s.fontFamily = el.fontFamily || 'inherit';
      s.fontWeight = el.fontWeight || 400;
      s.color = el.color || 'inherit';
      s.textAlign = el.align || 'left';
      s.lineHeight = el.lineHeight || 1.25;
      if (el.letterSpacing) s.letterSpacing = el.letterSpacing+'px';
      var sp = document.createElement('span');
      sp.innerHTML = el.html || '';
      d.appendChild(sp);
    } else if (el.type === 'shape'){
      s.background = el.fill || 'transparent';
      if (el.radius) s.borderRadius = el.radius+'px';
      if (el.shape === 'ellipse') s.borderRadius = '50%';
      if (el.stroke && el.strokeWidth)
        s.border = el.strokeWidth+'px '+(el.strokeStyle||'solid')+' '+el.stroke;
    } else if (el.type === 'image'){
      var im = document.createElement('img');
      im.src = el.src; im.style.width='100%'; im.style.height='100%';
      im.style.objectFit = el.fit || 'cover';
      if (el.radius) im.style.borderRadius = el.radius+'px';
      d.appendChild(im);
    }
    return d;
  }

  function buildSlide(sl, i){
    var w = document.createElement('section');
    w.className = 'slide'; w.dataset.i = i;
    if (sl.background) w.style.background = sl.background;
    sl.elements.forEach(function(e){ w.appendChild(build(e)); });
    return w;
  }

  var nodes = SL.map(buildSlide);
  nodes.forEach(function(n){ stage.appendChild(n); });

  /* ---------- scaling ---------- */
  var viewport = document.getElementById('viewport');
  function fit(){
    var pad = 0.94;
    var r = viewport.getBoundingClientRect();
    var k = Math.min(r.width/W, r.height/H) * pad;
    stage.style.transform = 'translate(-50%,-50%) scale('+k+')';
  }
  window.addEventListener('resize', fit); fit();

  /* ---------- navigation + morph ---------- */
  var cur = 0;
  var bar = document.querySelector('#bar>i');
  var hud = document.getElementById('hud');

  function geom(el){
    var s = getComputedStyle(el);
    return {left:s.left, top:s.top, width:s.width, height:s.height,
            fontSize:s.fontSize, color:s.color};
  }

  function show(next, animate){
    next = Math.max(0, Math.min(N-1, next));
    if (next === cur && animate) return;
    var from = nodes[cur], to = nodes[next];

    // snapshot morph sources before switching
    var src = {};
    if (animate && SL[next].transition === 'morph'){
      from.querySelectorAll('[data-morph]').forEach(function(e){
        src[e.dataset.morph] = geom(e);
      });
    }

    from.classList.remove('on');
    to.classList.add('on');
    cur = next;

    if (animate){
      var morphed = {};
      to.querySelectorAll('[data-morph]').forEach(function(e){
        var s = src[e.dataset.morph];
        if (!s) return;
        morphed[e.dataset.morph] = 1;
        e.animate([{left:s.left, top:s.top, width:s.width, height:s.height,
                    fontSize:s.fontSize, color:s.color}, {}],
                  {duration:420, easing:'cubic-bezier(.4,0,.2,1)'});
      });
      Array.prototype.forEach.call(to.children, function(e){
        if (e.dataset.morph && morphed[e.dataset.morph]) return;
        e.animate([{opacity:0, transform:'translateY(8px)'},
                   {opacity:getComputedStyle(e).opacity, transform:'none'}],
                  {duration:300, easing:'ease-out'});
      });
    }

    bar.style.width = (((cur+1)/N)*100)+'%';
    hud.textContent = (cur+1) + ' / ' + N;
    paintNotes();
    markThumb();
  }

  /* ---------- notes ---------- */
  var notes = document.getElementById('notes');
  function paintNotes(){
    notes.querySelector('.nm').textContent = SL[cur].name || ('Slide '+(cur+1));
    notes.querySelector('pre').textContent = SL[cur].notes || '— none —';
    var nx = notes.querySelector('.nx');
    nx.textContent = cur+1 < N ? ('Next → ' + (SL[cur+1].name || ('Slide '+(cur+2)))) : 'End';
  }

  function toggleNotes(){
    var open = notes.classList.toggle('open');
    viewport.classList.toggle('shrunk', open);
    setTimeout(fit, 240);
    fit();
  }

  /* ---------- overview ---------- */
  var grid = document.getElementById('grid'), gridBuilt = false;
  function buildGrid(){
    if (gridBuilt) return; gridBuilt = true;
    SL.forEach(function(sl, i){
      var t = document.createElement('div'); t.className = 'thumb'; t.dataset.i = i;
      var inner = document.createElement('div'); inner.className = 'inner';
      if (sl.background) inner.style.background = sl.background;
      sl.elements.forEach(function(e){ inner.appendChild(build(e)); });
      t.appendChild(inner);
      var lab = document.createElement('b'); lab.textContent = i+1; t.appendChild(lab);
      t.addEventListener('click', function(){
        closeGrid(); show(i, true);
      });
      grid.appendChild(t);
    });
    scaleThumbs();
  }
  function scaleThumbs(){
    grid.querySelectorAll('.thumb').forEach(function(t){
      var k = t.clientWidth / W;
      t.querySelector('.inner').style.transform = 'scale('+k+')';
    });
  }
  function markThumb(){
    grid.querySelectorAll('.thumb').forEach(function(t){
      t.classList.toggle('cur', +t.dataset.i === cur);
    });
  }
  function openGrid(){ buildGrid(); grid.classList.add('open'); scaleThumbs(); markThumb(); }
  function closeGrid(){ grid.classList.remove('open'); }
  window.addEventListener('resize', function(){ if (grid.classList.contains('open')) scaleThumbs(); });

  /* ---------- print ---------- */
  var printed = false;
  function buildPrint(){
    if (printed) return; printed = true;
    var p = document.getElementById('print');
    SL.forEach(function(sl){
      var pg = document.createElement('div'); pg.className = 'page';
      if (sl.background) pg.style.background = sl.background;
      sl.elements.forEach(function(e){ pg.appendChild(build(e)); });
      p.appendChild(pg);
    });
  }
  window.addEventListener('beforeprint', buildPrint);

  /* ---------- input ---------- */
  var hint = document.getElementById('hint');
  var hintT = setTimeout(function(){ hint.classList.add('fade'); }, 4000);

  document.addEventListener('keydown', function(e){
    var k = e.key;
    if (grid.classList.contains('open')){
      if (k === 'Escape' || k === 'g' || k === 'G'){ closeGrid(); e.preventDefault(); }
      return;
    }
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ' || k === 'Enter'){ show(cur+1, true); e.preventDefault(); }
    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace'){ show(cur-1, true); e.preventDefault(); }
    else if (k === 'Home'){ show(0, true); e.preventDefault(); }
    else if (k === 'End'){ show(N-1, true); e.preventDefault(); }
    else if (k === 'n' || k === 'N' || k === 's' || k === 'S'){ toggleNotes(); e.preventDefault(); }
    else if (k === 'g' || k === 'G'){ openGrid(); e.preventDefault(); }
    else if (k === 'f' || k === 'F'){
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
      e.preventDefault();
    }
    else if (k === 'p' || k === 'P'){ buildPrint(); window.print(); e.preventDefault(); }
  });

  viewport.addEventListener('click', function(e){
    var r = viewport.getBoundingClientRect();
    show(cur + (e.clientX < r.left + r.width*0.25 ? -1 : 1), true);
  });
  notes.addEventListener('click', function(e){ e.stopPropagation(); });

  // hash deep-link, e.g. #7
  function fromHash(){
    var n = parseInt(location.hash.replace('#',''), 10);
    return isFinite(n) && n >= 1 && n <= N ? n-1 : 0;
  }
  window.addEventListener('hashchange', function(){ show(fromHash(), true); });

  show(fromHash(), false);
})();
</script>
</body>
</html>
