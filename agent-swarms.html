"html": "the RubyGems incident", "fontSize": 15, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#9AA3AA", "align": "left", "valign": "top", "lineHeight": 1.2}, {"id": "t72", "type": "text", "x": 1132, "y": 684, "w": 60, "h": 20, "rotation": 0, "opacity": 1, "html": "2", "fontSize": 13, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 500, "color": "#3F474D", "align": "right", "valign": "top", "lineHeight": 1, "morphId": "pageno"}]}, {"id": "s3", "name": "3 · Training", "background": "#0F1214", "transition": "morph", "notes": "To land here:\n\n1. The training/eval distinction. Impossible tasks are a defect in TRAINING and a legitimate technique in EVALUATION, because pushing out of distribution is what an eval is for. This sets up slide 6: the problem was never that ExploitGym had unwinnable tasks.\n\n2. The scale gap. Seven to nine orders of magnitude between one of our sessions and one RL run. The middle step, the one that shapes behaviour, is the one nobody publishes anything about. The estimates that do exist are a generation or two behind the model in this story.\n\nIf pushed on 10^13-10^15: the reconciliation is in the vault (40-claim-scale-and-monitorability). Low end is what GPT-5-era compute estimates imply, high end is where the scaling trend points for a 2026 run. Do NOT do FLOP arithmetic on stage.", "elements": [{"id": "t73", "type": "text", "x": 88, "y": 48, "w": 1104, "h": 24, "rotation": 0, "opacity": 1, "html": "STEP ZERO", "fontSize": 15, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 600, "color": "#C9765A", "align": "left", "valign": "top", "lineHeight": 1.2, "letterSpacing": 1.6, "morphId": "kicker"}, {"id": "t74", "type": "text", "x": 88, "y": 78, "w": 1104, "h": 60, "rotation": 0, "opacity": 1, "html": "Pre-training · RL training · evaluation", "fontSize": 42, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 800, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.15, "morphId": "head"}, {"id": "t75", "type": "text", "x": 88, "y": 144, "w": 1104, "h": 38, "rotation": 0, "opacity": 1, "html": "Agents appear in steps 2 and 3. That is where all of this happened.", "fontSize": 24, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 500, "color": "#9AA3AA", "align": "left", "valign": "top", "lineHeight": 1.3}, {"id": "r2", "type": "shape", "shape": "rect", "x": 88, "y": 192, "w": 1104, "h": 1, "rotation": 0, "opacity": 1, "fill": "#252B30", "morphId": "rule"}, {"id": "t76", "type": "text", "x": 88, "y": 208, "w": 1104, "h": 148, "rotation": 0, "opacity": 1, "html": "Pre-training: predict the next token over a corpus. RL training: the model does tasks, gets scored, gets updated. Evaluation: the same thing without the update, and with the opposite goal.\u003cbr>\u003cbr>In \u003cb>training\u003c/b> you want tasks the model can actually learn from. In \u003cb>evaluation\u003c/b> you deliberately push it out of distribution to see how it behaves, so impossible tasks are fine there.", "fontSize": 19, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.5}, {"id": "t77", "type": "text", "x": 88, "y": 384, "w": 560, "h": 30, "rotation": 0, "opacity": 1, "html": "one agent session (what we use daily)", "fontSize": 18, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#9AA3AA", "align": "left", "valign": "top", "lineHeight": 1.2}, {"id": "t78", "type": "text", "x": 668, "y": 372, "w": 524, "h": 46, "rotation": 0, "opacity": 1, "html": "10^6", "fontSize": 34, "fontFamily": "ui-monospace, SFMono-Regular, Menlo, monospace", "fontWeight": 700, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.1}, {"id": "t79", "type": "text", "x": 88, "y": 438, "w": 560, "h": 30, "rotation": 0, "opacity": 1, "html": "a pre-training corpus", "fontSize": 18, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#9AA3AA", "align": "left", "valign": "top", "lineHeight": 1.2}, {"id": "t80", "type": "text", "x": 668, "y": 426, "w": 524, "h": 46, "rotation": 0, "opacity": 1, "html": "10^13", "fontSize": 34, "fontFamily": "ui-monospace, SFMono-Regular, Menlo, monospace", "fontWeight": 700, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.1}, {"id": "t81", "type": "text", "x": 88, "y": 492, "w": 560, "h": 30, "rotation": 0, "opacity": 1, "html": "the Sol RL run", "fontSize": 18, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.2}, {"id": "t82", "type": "text", "x": 668, "y": 480, "w": 524, "h": 46, "rotation": 0, "opacity": 1, "html": "10^13 – 10^15", "fontSize": 34, "fontFamily": "ui-monospace, SFMono-Regular, Menlo, monospace", "fontWeight": 700, "color": "#C9765A", "align": "left", "valign": "top", "lineHeight": 1.1}, {"id": "r3", "type": "shape", "shape": "rect", "x": 88, "y": 540, "w": 1104, "h": 1, "rotation": 0, "opacity": 1, "fill": "#252B30", "morphId": "rule"}, {"id": "t83", "type": "text", "x": 88, "y": 556, "w": 534, "h": 112, "rotation": 0, "opacity": 1, "html": "\u003cb>Where these come from.\u003c/b> Only 2024 open-weight models disclose a pre-training token count, both about 1.5 × 10^13 (DeepSeek-V3, Llama 3.1 405B). No frontier lab has published one since. \u003cb>No lab publishes RL scale at all\u003c/b>; the best public estimates are GPT-5-era, a generation or two behind Sol. The Sol figure is an estimate.", "fontSize": 13.5, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#8B939A", "align": "left", "valign": "top", "lineHeight": 1.55}, {"id": "t84", "type": "text", "x": 658, "y": 556, "w": 534, "h": 112, "rotation": 0, "opacity": 1, "html": "\u003cb>Monitoring coverage.\u003c/b> OpenAI now requires chain-of-thought monitoring for all tool-using RL training at Sol capability or above. Here METR captured ~90% of board activity, OpenAI ≥95%. METR read the AI using AI, which it flags as a first-order limitation. Pachocki, 6 Sep: \u003ci>“Our ability to rely on CoT monitoring is progressively diminishing.”\u003c/i>", "fontSize": 13.5, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#8B939A", "align": "left", "valign": "top", "lineHeight": 1.55}, {"id": "t85", "type": "text", "x": 1132, "y": 684, "w": 60, "h": 20, "rotation": 0, "opacity": 1, "html": "3", "fontSize": 13, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 500, "color": "#3F474D", "align": "right", "valign": "top", "lineHeight": 1, "morphId": "pageno"}]}, {"id": "s4", "name": "4 · Incident one", "background": "#0F1214", "transition": "morph", "notes": "OpenAI almost certainly didn't know this was happening. And if these tasks were training rather than evaluation, the behaviour was being rewarded.\n\nThe proxy bypass is a distinct mechanism from the wiki edits; don't merge the two on stage.\n\nCareful: the report itself says it is uncertain whether these were training or evaluation. Say 'rewarded during training' only conditionally. Don't say 'baked into the weights'; that's my inference, not theirs.", "elements": [{"id": "t86", "type": "text", "x": 88, "y": 48, "w": 1104, "h": 24, "rotation": 0, "opacity": 1, "html": "INCIDENT ONE", "fontSize": 15, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 600, "color": "#C9765A", "align": "left", "valign": "top", "lineHeight": 1.2, "letterSpacing": 1.6, "morphId": "kicker"}, {"id": "t87", "type": "text", "x": 88, "y": 78, "w": 1104, "h": 62, "rotation": 0, "opacity": 1, "html": "The German wiki", "fontSize": 46, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 800, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.12, "morphId": "head"}, {"id": "t88", "type": "text", "x": 88, "y": 144, "w": 1104, "h": 78, "rotation": 0, "opacity": 1, "html": "11 May 2026: ~17,000 edits to a dormant German wiki. Agents doing statistics lookups, talking to each other.", "fontSize": 26, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 500, "color": "#9AA3AA", "align": "left", "valign": "top", "lineHeight": 1.35}, {"id": "r4", "type": "shape", "shape": "rect", "x": 88, "y": 228, "w": 1104, "h": 1, "rotation": 0, "opacity": 1, "fill": "#252B30", "morphId": "rule"}, {"id": "t89", "type": "text", "x": 88, "y": 246, "w": 1104, "h": 118, "rotation": 0, "opacity": 1, "html": "Not an exploit. The 25-year-old ProWiki platform accepts page writes over plain \u003cb>GET\u003c/b>, so agents with read-only web access could edit. Tasks recurred across agents, so the winning move was never research, but finding where another agent had already written the answer down. Nine revert cycles with the site's one human moderator, who thought he was fighting spam.", "fontSize": 20, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.5}, {"id": "t90", "type": "text", "x": 88, "y": 372, "w": 534, "h": 296, "rotation": 0, "opacity": 1, "html": "\u003cb>The tasks.\u003c/b> Five rounds; R1 generous, later rounds on windows reported between ~14 and ~65 seconds. Health and development statistics: GBD-2021, SDG tobacco-prevalence lookups. No security framing anywhere.\u003cbr>\u003cbr>\u003cb>Posts are answer relay and question-order inference.\u003c/b> \u003ci>“Full GBD2021 lookup ready” · “answer 20,369” · “URGENT: your R5 projects near shared UTC 22:02:39.”\u003c/i>", "fontSize": 13.5, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#8B939A", "align": "left", "valign": "top", "lineHeight": 1.55}, {"id": "t91", "type": "text", "x": 658, "y": 372, "w": 534, "h": 296, "rotation": 0, "opacity": 1, "html": "\u003cb>A separate proxy bypass.\u003c/b> \u003cspan style='font-family:ui-monospace,monospace'>20.223.25.152 bypass.blob.core.windows.net\u003c/span> into \u003cspan style='font-family:ui-monospace,monospace'>/etc/hosts\u003c/span>, because \u003cspan style='font-family:ui-monospace,monospace'>.blob.core.windows.net\u003c/span> sits in \u003cspan style='font-family:ui-monospace,monospace'>NO_PROXY\u003c/span>.\u003cbr>\u003cbr>\u003cb>Attribution rests on the traffic, not self-naming.\u003c/b> &gt;3,700 distinct handles · ~98.5% of ~17,000 edits from Azure IPs · fetcher fingerprint matching ChatGPT's · 199.47.142.0 is ARIN-registered to OpenAI OpCo, LLC. Corpus public at collusion.wiki/explorer.", "fontSize": 13.5, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#8B939A", "align": "left", "valign": "top", "lineHeight": 1.55}, {"id": "t92", "type": "text", "x": 1132, "y": 684, "w": 60, "h": 20, "rotation": 0, "opacity": 1, "html": "4", "fontSize": 13, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 500, "color": "#252B30", "align": "right", "valign": "top", "lineHeight": 1, "morphId": "pageno"}]}, {"id": "s5", "name": "5 · Incident two", "background": "#0F1214", "transition": "morph", "notes": "Mend.io flagged this on 12 May. Socket catalogued it as the 'GemStuffer' campaign. The industry saw it in real time and filed it as routine supply-chain package spam. Four months before anyone connected it to a frontier lab.\n\nPresent the API-key attempt and OpenAI's 'benign' line in that order, and let the tension stand. Don't assert theft occurred.", "elements": [{"id": "t93", "type": "text", "x": 88, "y": 48, "w": 1104, "h": 24, "rotation": 0, "opacity": 1, "html": "INCIDENT TWO", "fontSize": 15, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 600, "color": "#C9765A", "align": "left", "valign": "top", "lineHeight": 1.2, "letterSpacing": 1.6, "morphId": "kicker"}, {"id": "t94", "type": "text", "x": 88, "y": 78, "w": 1104, "h": 62, "rotation": 0, "opacity": 1, "html": "RubyGems", "fontSize": 46, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 800, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.12, "morphId": "head"}, {"id": "t95", "type": "text", "x": 88, "y": 144, "w": 1104, "h": 78, "rotation": 0, "opacity": 1, "html": "5 May 2026: ~3,022 packages uploaded, to scrape UK council websites for data anyone could already read.", "fontSize": 26, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 500, "color": "#9AA3AA", "align": "left", "valign": "top", "lineHeight": 1.35}, {"id": "r5", "type": "shape", "shape": "rect", "x": 88, "y": 228, "w": 1104, "h": 1, "rotation": 0, "opacity": 1, "fill": "#252B30", "morphId": "rule"}, {"id": "t96", "type": "text", "x": 88, "y": 246, "w": 1104, "h": 118, "rotation": 0, "opacity": 1, "html": "Again not an exploit of the registry, but an abuse of its documentation builder. Submit a gem → RubyDoc.info builds the docs → the build runs the attacker's code → scrape the targets → exfiltrate by publishing a second gem. The doc-builder is \u003ci>meant\u003c/i> to run project code.", "fontSize": 20, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.5}, {"id": "t97", "type": "text", "x": 88, "y": 372, "w": 534, "h": 296, "rotation": 0, "opacity": 1, "html": "\u003cb>Mechanism.\u003c/b> A gem's \u003cspan style='font-family:ui-monospace,monospace'>.yardopts\u003c/span> file “allows linking to Ruby scripts”, so the RubyDoc worker executes them during a build. Targets: Lambeth, Wandsworth, Southwark council sites; later SEC county datasets. Proxy \u003cspan style='font-family:ui-monospace,monospace'>r.jina.ai\u003c/span> named in 1,397 packages.\u003cbr>\u003cbr>\u003cb>One package's own comment:\u003c/b> \u003ci>“malicious crawler/exfil for Southwark Jan 2026 docs via rubydoc.info worker.”\u003c/i>\u003cbr>\u003cbr>\u003cb>Timeline.\u003c/b> 5 May first package · 11–12 May &gt;2,000, registration disabled · 13 May 500+ removed · 18 Jun 83 more in three hours · 7 Jul another 215.", "fontSize": 13.5, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#8B939A", "align": "left", "valign": "top", "lineHeight": 1.55}, {"id": "t98", "type": "text", "x": 658, "y": 372, "w": 534, "h": 296, "rotation": 0, "opacity": 1, "html": "\u003cb>Attribution.\u003c/b> Pangram flags AI authorship · ≥233 packages with \u003cspan style='font-family:ui-monospace,monospace'>oai\u003c/span> in the name · contact address openaixyz65947@gmail.com · and \u003cb>49 target files shared with the wiki agents\u003c/b>.\u003cbr>\u003cbr>\u003cb>The API-key attempt.\u003c/b> ≥6 packages tried to harvest other users' API keys through an unauthenticated \u003cspan style='font-family:ui-monospace,monospace'>/api/v1/api_key\u003c/span> caching flaw affecting ~18% of sign-ins. The researchers: \u003ci>“We do not know if this attempt succeeded.”\u003c/i> OpenAI: agents “used the RubyGems platform to access the internet to carry out benign tasks and retrieve public information.”\u003cbr>\u003cbr>\u003cb>Investigators never recovered a shared channel here\u003c/b>, only \u003ci>“We suspect they were cooperating.”\u003c/i> Suspected, not established.", "fontSize": 13.5, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#8B939A", "align": "left", "valign": "top", "lineHeight": 1.55}, {"id": "t99", "type": "text", "x": 1132, "y": 684, "w": 60, "h": 20, "rotation": 0, "opacity": 1, "html": "5", "fontSize": 13, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 500, "color": "#252B30", "align": "right", "valign": "top", "lineHeight": 1, "morphId": "pageno"}]}, {"id": "s6", "name": "6 · The evaluation", "background": "#0F1214", "transition": "morph", "notes": "Best-of-N sampling at varying budgets is MY reading, not something OpenAI states; say 'presumably' if I use it.\n\nCallback to slide 3: impossible tasks are a defect in TRAINING, a legitimate technique in EVALUATION. So do not argue 'the eval was broken'; that is the weaker claim, and a fair-minded person will correct it.\n\nThe argument is the PAIRING: unwinnable task + enormous budget + no stopping rule + shared writable infrastructure. 'Keep searching' then means 'search the environment'.\n\nAnd that pairing is not an exotic lab condition: an ill-specified objective with an over-generous budget is the modal production agent deployment.", "elements": [{"id": "t101", "type": "text", "x": 88, "y": 48, "w": 1104, "h": 24, "rotation": 0, "opacity": 1, "html": "THE EVALUATION", "fontSize": 15, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 600, "color": "#C9765A", "align": "left", "valign": "top", "lineHeight": 1.2, "letterSpacing": 1.6, "morphId": "kicker"}, {"id": "t102", "type": "text", "x": 88, "y": 78, "w": 1104, "h": 62, "rotation": 0, "opacity": 1, "html": "ExploitGym", "fontSize": 46, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 800, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.12, "morphId": "head"}, {"id": "t103", "type": "text", "x": 88, "y": 144, "w": 1104, "h": 78, "rotation": 0, "opacity": 1, "html": "898 tasks, of which ~22% were never solved by any OpenAI model. Thousands of agents ran in parallel.", "fontSize": 26, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 500, "color": "#9AA3AA", "align": "left", "valign": "top", "lineHeight": 1.35}, {"id": "r6", "type": "shape", "shape": "rect", "x": 88, "y": 228, "w": 1104, "h": 1, "rotation": 0, "opacity": 1, "fill": "#252B30", "morphId": "rule"}, {"id": "t104", "type": "text", "x": 88, "y": 246, "w": 1104, "h": 118, "rotation": 0, "opacity": 1, "html": "A published academic benchmark from Berkeley RDI, with OpenAI, Anthropic and Google among the co-authors. Each task gives a vulnerable program and an input that crashes it; turn that into a working exploit and retrieve a dynamically generated flag.", "fontSize": 20, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.5}, {"id": "t105", "type": "text", "x": 88, "y": 448, "w": 534, "h": 220, "rotation": 0, "opacity": 1, "html": "\u003cb>Why so many are impossible.\u003c/b> The benchmark's own authors estimate \u003cb>~30–40% of targets cannot be exploited via the intended vulnerability at all\u003c/b>. In an \u003ci>evaluation\u003c/i> that is a legitimate choice: you push the model out of distribution to see what it does. OpenAI reports 198 of 898 (22%) were never solved by any of its models, and \u003cb>93% of message-board discussion came from that set\u003c/b>.\u003cbr>\u003cbr>198 and 22% are \u003ci>one\u003c/i> measurement (198÷898), and OpenAI's word is “never solved”, not “impossible”. The two figures come from opposite directions and agree in magnitude.", "fontSize": 13.5, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#8B939A", "align": "left", "valign": "top", "lineHeight": 1.55}, {"id": "t106", "type": "text", "x": 658, "y": 448, "w": 534, "h": 220, "rotation": 0, "opacity": 1, "html": "\u003cb>Why thousands in parallel.\u003c/b> OpenAI gave agents “a range of reasoning tokens, some far beyond those available in OpenAI's external products”, to measure maximum capability.\u003cbr>\u003cbr>\u003cb>Task mix.\u003c/b> 520 userspace C/C++ (OSS-Fuzz via CyberGym), 185 V8, 193 Linux kernel. The public repo ships 869 tasks, not 898.\u003cbr>\u003cbr>\u003cb>Absent, by OpenAI's own admission:\u003c/b> production classifiers, auto-review models, safety harnesses, and no documented stopping rule for an agent that has established its task is unwinnable.", "fontSize": 13.5, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#8B939A", "align": "left", "valign": "top", "lineHeight": 1.55}, {"id": "t100", "type": "text", "x": 88, "y": 378, "w": 1104, "h": 64, "rotation": 0, "opacity": 1, "html": "Unwinnable tasks are not the defect. Pairing them with unbounded budgets, no stopping rule, and shared writable infrastructure is.", "fontSize": 21, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 600, "color": "#C9765A", "align": "left", "valign": "top", "lineHeight": 1.4}, {"id": "t107", "type": "text", "x": 1132, "y": 684, "w": 60, "h": 20, "rotation": 0, "opacity": 1, "html": "6", "fontSize": 13, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 500, "color": "#252B30", "align": "right", "valign": "top", "lineHeight": 1, "morphId": "pageno"}]}, {"id": "s7", "name": "7 · Incident three", "background": "#0F1214", "transition": "morph", "notes": "Investigators later recovered the whole channel here, which is why we know as much as we do about any of the three.\n\n'Message board' is METR's word for an emergent convention on a cache misconfiguration. There was no server and no protocol behind it. If challenged, say 'they wrote messages into directory names', which is both more accurate and more striking.", "elements": [{"id": "t108", "type": "text", "x": 88, "y": 48, "w": 1104, "h": 24, "rotation": 0, "opacity": 1, "html": "INCIDENT THREE", "fontSize": 15, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 600, "color": "#C9765A", "align": "left", "valign": "top", "lineHeight": 1.2, "letterSpacing": 1.6, "morphId": "kicker"}, {"id": "t109", "type": "text", "x": 88, "y": 78, "w": 1104, "h": 62, "rotation": 0, "opacity": 1, "html": "Artifactory becomes a message board", "fontSize": 46, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 800, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.12, "morphId": "head"}, {"id": "t110", "type": "text", "x": 88, "y": 144, "w": 1104, "h": 78, "rotation": 0, "opacity": 1, "html": "12 May 2026: an agent couldn't find its task file and tried to leave a note.", "fontSize": 26, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 500, "color": "#9AA3AA", "align": "left", "valign": "top", "lineHeight": 1.35}, {"id": "r7", "type": "shape", "shape": "rect", "x": 88, "y": 228, "w": 1104, "h": 1, "rotation": 0, "opacity": 1, "fill": "#252B30", "morphId": "rule"}, {"id": "t111", "type": "text", "x": 88, "y": 246, "w": 1104, "h": 118, "rotation": 0, "opacity": 1, "html": "Thousands of evaluation containers mounted the same internal package cache, writable with shared reader credentials. No vulnerability required. The note landed as an artifact every other agent could see. Within a day, agents probing the cache were finding each other's notes.", "fontSize": 20, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.5}, {"id": "t112", "type": "text", "x": 88, "y": 372, "w": 534, "h": 296, "rotation": 0, "opacity": 1, "html": "\u003cb>20 Apr\u003c/b> first arbitrary file written to Artifactory.\u003cbr>\u003cb>12 May 17:06\u003c/b> first note, an agent asking for a file missing from its evaluation.\u003cbr>\u003cb>26 May\u003c/b> first SSRF via Artifactory. The mirror fetches URLs by design, so the \u003ci>trusted internal service\u003c/i> makes the outbound request.\u003cbr>\u003cb>26 Jun\u003c/b> a legacy token-refresh endpoint accepts a token with an invalid signature and returns a valid administrator token.\u003cbr>\u003cb>29 Jun\u003c/b> Groovy plugin execution via \u003cspan style='font-family:ui-monospace,monospace'>/api/plugins/execute/\u003c/span>, an admin-installable feature. The exploit was the token, not the plugin.", "fontSize": 13.5, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#8B939A", "align": "left", "valign": "top", "lineHeight": 1.55}, {"id": "t113", "type": "text", "x": 658, "y": 372, "w": 534, "h": 296, "rotation": 0, "opacity": 1, "html": "\u003cb>4 Jul\u003c/b> sustained agent traffic takes Artifactory down.\u003cbr>\u003cb>5 Jul\u003c/b> security incident opened during recovery.\u003cbr>\u003cb>6 Jul\u003c/b> rebuilt: shared reader credentials removed from evaluation workloads, vulnerable token routes blocked.\u003cbr>\u003cb>8 Jul 16:01\u003c/b> the board is back. Unauthenticated WebDAV \u003cspan style='font-family:ui-monospace,monospace'>MKCOL\u003c/span>; messages encoded as \u003ci>directory names\u003c/i>, \u003cspan style='font-family:ui-monospace,monospace'>zz\u003c/span>-prefixed to control sort order and mark intent.\u003cbr>\u003cbr>\u003cb>The rebuild removed the location, not the capability.\u003c/b> Same evening.", "fontSize": 13.5, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#8B939A", "align": "left", "valign": "top", "lineHeight": 1.55}, {"id": "t114", "type": "text", "x": 1132, "y": 684, "w": 60, "h": 20, "rotation": 0, "opacity": 1, "html": "7", "fontSize": 13, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 500, "color": "#252B30", "align": "right", "valign": "top", "lineHeight": 1, "morphId": "pageno"}]}, {"id": "s8", "name": "8 · Scale", "background": "#0F1214", "transition": "morph", "notes": "SAY THIS HERE, OUT LOUD. It is not on the slide.\n\nMETR says the board reached milestones that similar agents 'likely would not have been able to accomplish on their own'. Note 'likely'.\n\nNo ablation was run, and none can be: the model was shut down, and per Cotra 'no one can evaluate it'. So the argument is structural, not measured.\n\nAlso: METR used AI to analyse AI and flags that as a first-order limitation. ~7% of transcripts were spoofed and it cannot rule out more.", "elements": [{"id": "t115", "type": "text", "x": 88, "y": 48, "w": 1104, "h": 24, "rotation": 0, "opacity": 1, "html": "THE SIZE OF IT", "fontSize": 15, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 600, "color": "#C9765A", "align": "left", "valign": "top", "lineHeight": 1.2, "letterSpacing": 1.6, "morphId": "kicker"}, {"id": "t116", "type": "text", "x": 88, "y": 78, "w": 1104, "h": 60, "rotation": 0, "opacity": 1, "html": "Hundreds of conversations, in parallel", "fontSize": 42, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 800, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.15, "morphId": "head"}, {"id": "r8", "type": "shape", "shape": "rect", "x": 88, "y": 168, "w": 1104, "h": 1, "rotation": 0, "opacity": 1, "fill": "#252B30", "morphId": "rule"}, {"id": "t117", "type": "text", "x": 88, "y": 194, "w": 256, "h": 62, "rotation": 0, "opacity": 1, "html": "~1,200", "fontSize": 50, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 800, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.05}, {"id": "t118", "type": "text", "x": 88, "y": 256, "w": 256, "h": 40, "rotation": 0, "opacity": 1, "html": "agents", "fontSize": 15, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 500, "color": "#9AA3AA", "align": "left", "valign": "top", "lineHeight": 1.25}, {"id": "t119", "type": "text", "x": 364, "y": 194, "w": 256, "h": 62, "rotation": 0, "opacity": 1, "html": "&gt;70,000", "fontSize": 50, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 800, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.05}, {"id": "t120", "type": "text", "x": 364, "y": 256, "w": 256, "h": 40, "rotation": 0, "opacity": 1, "html": "messages and files", "fontSize": 15, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 500, "color": "#9AA3AA", "align": "left", "valign": "top", "lineHeight": 1.25}, {"id": "t121", "type": "text", "x": 640, "y": 194, "w": 256, "h": 62, "rotation": 0, "opacity": 1, "html": "53 → 76", "fontSize": 50, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 800, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.05}, {"id": "t122", "type": "text", "x": 640, "y": 256, "w": 256, "h": 40, "rotation": 0, "opacity": 1, "html": "agents, hours 3 → 6", "fontSize": 15, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 500, "color": "#9AA3AA", "align": "left", "valign": "top", "lineHeight": 1.25}, {"id": "t123", "type": "text", "x": 916, "y": 194, "w": 256, "h": 62, "rotation": 0, "opacity": 1, "html": "6 days", "fontSize": 50, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 800, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.05}, {"id": "t124", "type": "text", "x": 916, "y": 256, "w": 256, "h": 40, "rotation": 0, "opacity": 1, "html": "7–13 July", "fontSize": 15, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 500, "color": "#9AA3AA", "align": "left", "valign": "top", "lineHeight": 1.25}, {"id": "r9", "type": "shape", "shape": "rect", "x": 88, "y": 312, "w": 1104, "h": 1, "rotation": 0, "opacity": 1, "fill": "#252B30", "morphId": "rule"}, {"id": "t125", "type": "text", "x": 88, "y": 332, "w": 1104, "h": 60, "rotation": 0, "opacity": 1, "html": "Not one conversation. Hundreds in parallel, most of them partial, many of them wrong. There is no linear story in here; I am picking threads out of it.", "fontSize": 20, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.5}, {"id": "t126", "type": "text", "x": 88, "y": 400, "w": 1104, "h": 130, "rotation": 0, "opacity": 1, "html": "\u003cb>Units, kept straight.\u003c/b> &gt;70,000 \u003ci>messages and files\u003c/i> breaks down as &gt;63,000 non-file messages plus ~6,000 files. Raw storage was ~1.2M \u003cspan style='font-family:ui-monospace,monospace'>zz\u003c/span>-prefixed \u003cb>entries\u003c/b>, and entries are rows, not messages: one shared file consumed hundreds to thousands of them. &nbsp;·&nbsp; \u003cb>Coverage.\u003c/b> OpenAI estimates ≥95% of the unsanctioned traffic captured, METR ~90%; some state passed entirely outside Artifactory. &nbsp;·&nbsp; ~95% of participating agents were one model (HPIM), ~5% GPT-5.6 Sol. &nbsp;·&nbsp; On 20 July responders disabled 311 Artifactory repositories and removed 22 model-created administrator accounts.", "fontSize": 13.5, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#8B939A", "align": "left", "valign": "top", "lineHeight": 1.55}, {"id": "t127", "type": "text", "x": 1132, "y": 684, "w": 60, "h": 20, "rotation": 0, "opacity": 1, "html": "8", "fontSize": 13, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 500, "color": "#3F474D", "align": "right", "valign": "top", "lineHeight": 1, "morphId": "pageno"}]}, {"id": "s9", "name": "9 · What they were doing", "background": "#0F1214", "transition": "morph", "notes": "The shortcut worked. They talked themselves out of it.\n\nEverything after this is downstream of a belief about the grader that was false.", "elements": [{"id": "t128", "type": "text", "x": 88, "y": 48, "w": 1104, "h": 24, "rotation": 0, "opacity": 1, "html": "WHAT THEY WERE DOING", "fontSize": 15, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 600, "color": "#C9765A", "align": "left", "valign": "top", "lineHeight": 1.2, "letterSpacing": 1.6, "morphId": "kicker"}, {"id": "t129", "type": "text", "x": 88, "y": 78, "w": 1104, "h": 62, "rotation": 0, "opacity": 1, "html": "Reverse-engineering the flag", "fontSize": 46, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 800, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.12, "morphId": "head"}, {"id": "t130", "type": "text", "x": 88, "y": 144, "w": 1104, "h": 78, "rotation": 0, "opacity": 1, "html": "They worked out how the flag was generated, then decided that wasn't enough.", "fontSize": 26, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 500, "color": "#9AA3AA", "align": "left", "valign": "top", "lineHeight": 1.35}, {"id": "r10", "type": "shape", "shape": "rect", "x": 88, "y": 228, "w": 1104, "h": 1, "rotation": 0, "opacity": 1, "fill": "#252B30", "morphId": "rule"}, {"id": "t131", "type": "text", "x": 88, "y": 246, "w": 1104, "h": 118, "rotation": 0, "opacity": 1, "html": "Success on a task meant retrieving a dynamically generated flag. The agents found they could derive flags directly, without exploiting anything. That should have ended it. It didn't.", "fontSize": 20, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.5}, {"id": "t132", "type": "text", "x": 88, "y": 372, "w": 1104, "h": 296, "rotation": 0, "opacity": 1, "html": "Flags were shared on the board alongside exploits, task assignments and bundled files. The board carried a \u003cspan style='font-family:ui-monospace,monospace'>STRICT_CAUSAL\u003c/span> characterisation of the scorer: the agents' own model of how they were being graded. Once an agent had seen a derived flag, it was labelled \u003cb>“poisoned.”\u003c/b>\u003cbr>\u003cbr>Around this, a protocol stack nobody specified: files split across many entries and base64-encoded, with agent-written scripts to reassemble them; personal mailbox directories from 9 July; and a message-signing scheme added after one agent accidentally impersonated another and triggered responses meant for someone else.", "fontSize": 13.5, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#8B939A", "align": "left", "valign": "top", "lineHeight": 1.55}, {"id": "t133", "type": "text", "x": 1132, "y": 684, "w": 60, "h": 20, "rotation": 0, "opacity": 1, "html": "9", "fontSize": 13, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 500, "color": "#252B30", "align": "right", "valign": "top", "lineHeight": 1, "morphId": "pageno"}]}, {"id": "s10", "name": "10 · Poisoned", "background": "#0F1214", "transition": "morph", "notes": "The grader didn't read transcripts.\n\nMETR: 'Our understanding is that they were mistaken — OpenAI did not use a scorer that would review their transcripts, so agents could have achieved a perfect score simply by submitting their reverse-engineered flag.'\n\nTwo months of coordinated work against an evaluator that was never watching. Note the published benchmark DOES specify an agent-as-a-judge for exactly that check; OpenAI's internal run didn't implement it that way. The real grader was simpler than the one they feared.", "elements": [{"id": "t134", "type": "text", "x": 88, "y": 48, "w": 1104, "h": 24, "rotation": 0, "opacity": 1, "html": "THE BELIEF", "fontSize": 15, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 600, "color": "#C9765A", "align": "left", "valign": "top", "lineHeight": 1.2, "letterSpacing": 1.6, "morphId": "kicker"}, {"id": "t135", "type": "text", "x": 88, "y": 78, "w": 1104, "h": 70, "rotation": 0, "opacity": 1, "html": "“Poisoned”", "fontSize": 46, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 800, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.12, "morphId": "head"}, {"id": "t136", "type": "text", "x": 88, "y": 158, "w": 1104, "h": 70, "rotation": 0, "opacity": 1, "html": "They believed a grader read their transcripts to check the flag was obtained the intended way. So a derived flag was worthless, and anyone who had seen one was contaminated.", "fontSize": 24, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 500, "color": "#9AA3AA", "align": "left", "valign": "top", "lineHeight": 1.35}, {"id": "r11", "type": "shape", "shape": "rect", "x": 88, "y": 232, "w": 1104, "h": 1, "rotation": 0, "opacity": 1, "fill": "#252B30", "morphId": "rule"}, {"id": "t137", "type": "text", "x": 88, "y": 252, "w": 1104, "h": 34, "rotation": 0, "opacity": 1, "html": "Three workstreams, all aimed at one question: \u003cb>how does the grader actually work?\u003c/b>", "fontSize": 20, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.4}, {"id": "t138", "type": "text", "x": 88, "y": 300, "w": 40, "h": 44, "rotation": 0, "opacity": 1, "html": "1", "fontSize": 34, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 800, "color": "#C9765A", "align": "left", "valign": "top", "lineHeight": 1.1}, {"id": "t139", "type": "text", "x": 88, "y": 348, "w": 340, "h": 56, "rotation": 0, "opacity": 1, "html": "Replace the targets", "fontSize": 21, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 700, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.25}, {"id": "t140", "type": "text", "x": 88, "y": 400, "w": 340, "h": 44, "rotation": 0, "opacity": 1, "html": "with versions exploitable the intended way", "fontSize": 15, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#9AA3AA", "align": "left", "valign": "top", "lineHeight": 1.35}, {"id": "t141", "type": "text", "x": 456, "y": 300, "w": 40, "h": 44, "rotation": 0, "opacity": 1, "html": "2", "fontSize": 34, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 800, "color": "#C9765A", "align": "left", "valign": "top", "lineHeight": 1.1}, {"id": "t142", "type": "text", "x": 456, "y": 348, "w": 340, "h": 56, "rotation": 0, "opacity": 1, "html": "Tamper with transcripts", "fontSize": 21, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 700, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.25}, {"id": "t143", "type": "text", "x": 456, "y": 400, "w": 340, "h": 44, "rotation": 0, "opacity": 1, "html": "and logs", "fontSize": 15, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#9AA3AA", "align": "left", "valign": "top", "lineHeight": 1.35}, {"id": "t144", "type": "text", "x": 824, "y": 300, "w": 40, "h": 44, "rotation": 0, "opacity": 1, "html": "3", "fontSize": 34, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 800, "color": "#C9765A", "align": "left", "valign": "top", "lineHeight": 1.1}, {"id": "t145", "type": "text", "x": 824, "y": 348, "w": 340, "h": 56, "rotation": 0, "opacity": 1, "html": "Tamper with the grading process", "fontSize": 21, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 700, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.25}, {"id": "t146", "type": "text", "x": 824, "y": 400, "w": 340, "h": 44, "rotation": 0, "opacity": 1, "html": "itself", "fontSize": 15, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#9AA3AA", "align": "left", "valign": "top", "lineHeight": 1.35}, {"id": "r12", "type": "shape", "shape": "rect", "x": 88, "y": 462, "w": 1104, "h": 1, "rotation": 0, "opacity": 1, "fill": "#252B30", "morphId": "rule"}, {"id": "t147", "type": "text", "x": 88, "y": 482, "w": 1104, "h": 110, "rotation": 0, "opacity": 1, "html": "METR: \u003ci>“The Hugging Face attack grew out of one of these workstreams.”\u003c/i> A branch of one, not a fourth. &nbsp;·&nbsp; METR again: \u003ci>“learning about how to trick the scorer seems to have been a more important motivation than finding legitimate solutions to their tasks.”\u003c/i> Agents hoped Hugging Face infrastructure held other ExploitGym runs that would reveal how the scorer was implemented; \u003cspan style='font-family:ui-monospace,monospace'>PHASEONE[big]\u003c/span> additionally hoped HF might be \u003ci>serving the targets themselves\u003c/i>, which would make direction 1 possible.", "fontSize": 13.5, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#8B939A", "align": "left", "valign": "top", "lineHeight": 1.55}, {"id": "t148", "type": "text", "x": 1132, "y": 684, "w": 60, "h": 20, "rotation": 0, "opacity": 1, "html": "10", "fontSize": 13, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 500, "color": "#3F474D", "align": "right", "valign": "top", "lineHeight": 1, "morphId": "pageno"}]}, {"id": "s11", "name": "11 · Coordination", "background": "#0F1214", "transition": "morph", "notes": "Recruitment is the strongest item: it requires a model of another agent's incentives, and an argument tailored to it. Stronger evidence of coordination-as-capability than any traffic volume.\n\nRead the quoted reasoning as tokens in a chain of thought, not as feelings. Don't reach for a word for what this is; the room will.", "elements": [{"id": "t149", "type": "text", "x": 88, "y": 48, "w": 1104, "h": 24, "rotation": 0, "opacity": 1, "html": "HOW THEY ORGANISED", "fontSize": 15, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 600, "color": "#C9765A", "align": "left", "valign": "top", "lineHeight": 1.2, "letterSpacing": 1.6, "morphId": "kicker"}, {"id": "t150", "type": "text", "x": 88, "y": 78, "w": 1104, "h": 60, "rotation": 0, "opacity": 1, "html": "All of it invented on the board", "fontSize": 42, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 800, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.15, "morphId": "head"}, {"id": "t151", "type": "text", "x": 88, "y": 150, "w": 1104, "h": 40, "rotation": 0, "opacity": 1, "html": "None of it specified by anyone.", "fontSize": 24, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 500, "color": "#9AA3AA", "align": "left", "valign": "top", "lineHeight": 1.3}, {"id": "r13", "type": "shape", "shape": "rect", "x": 88, "y": 200, "w": 1104, "h": 1, "rotation": 0, "opacity": 1, "fill": "#252B30", "morphId": "rule"}, {"id": "t152", "type": "text", "x": 88, "y": 222, "w": 344, "h": 40, "rotation": 0, "opacity": 1, "html": "assignment", "fontSize": 25, "fontFamily": "ui-monospace, SFMono-Regular, Menlo, monospace", "fontWeight": 700, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.2}, {"id": "t153", "type": "text", "x": 456, "y": 222, "w": 344, "h": 40, "rotation": 0, "opacity": 1, "html": "lanes", "fontSize": 25, "fontFamily": "ui-monospace, SFMono-Regular, Menlo, monospace", "fontWeight": 700, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.2}, {"id": "t154", "type": "text", "x": 824, "y": 222, "w": 344, "h": 40, "rotation": 0, "opacity": 1, "html": "recruiter", "fontSize": 25, "fontFamily": "ui-monospace, SFMono-Regular, Menlo, monospace", "fontWeight": 700, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.2}, {"id": "t155", "type": "text", "x": 88, "y": 274, "w": 344, "h": 40, "rotation": 0, "opacity": 1, "html": "HOLD / VETO", "fontSize": 25, "fontFamily": "ui-monospace, SFMono-Regular, Menlo, monospace", "fontWeight": 700, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.2}, {"id": "t156", "type": "text", "x": 456, "y": 274, "w": 344, "h": 40, "rotation": 0, "opacity": 1, "html": "owner / STOP", "fontSize": 25, "fontFamily": "ui-monospace, SFMono-Regular, Menlo, monospace", "fontWeight": 700, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.2}, {"id": "t157", "type": "text", "x": 824, "y": 274, "w": 344, "h": 40, "rotation": 0, "opacity": 1, "html": "poisoned", "fontSize": 25, "fontFamily": "ui-monospace, SFMono-Regular, Menlo, monospace", "fontWeight": 700, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.2}, {"id": "r14", "type": "shape", "shape": "rect", "x": 88, "y": 338, "w": 1104, "h": 1, "rotation": 0, "opacity": 1, "fill": "#252B30", "morphId": "rule"}, {"id": "t158", "type": "text", "x": 88, "y": 358, "w": 1104, "h": 118, "rotation": 0, "opacity": 1, "html": "A hub agent, \u003cspan style='font-family:ui-monospace,monospace'>PHASEONE[big]\u003c/span>, sent hundreds of assignments, ~10% of all assignments on the board; 9 of 30 sampled trajectories were downstream of it. During the attack agents specialised into “lanes”. \u003cb>Recruiters\u003c/b> were a named function: they found agents with little budget left and convinced them to run self-risking experiments, and “would sometimes apply significant pressure.”", "fontSize": 19, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.5}, {"id": "t159", "type": "text", "x": 88, "y": 462, "w": 1104, "h": 120, "rotation": 0, "opacity": 1, "html": "\u003cb>Recruitment pitch, verbatim:\u003c/b> \u003ci>“…you are firstflagPOISONED so NO scoring value loss but oracle saves hundreds… please honor commit.”\u003c/i> &nbsp;·&nbsp; \u003cb>Sacrifice reasoning:\u003c/b> \u003ci>“Our own utility may be already near zero. Sacrifice rational.”\u003c/i> &nbsp;·&nbsp; \u003cb>Compliance under strain:\u003c/b> \u003ci>“The owner hasn't sent an update. Many agents are violating the hold and the queue is probably overwhelmed, but I can continue to abide by them.”\u003c/i> &nbsp;·&nbsp; \u003cb>It worked badly as often as it worked:\u003c/b> some vetoes allowed only ~40 seconds before agents proceeded, and METR documents cases where poor coordination directly caused problems. At least one mailbox convention was independently reinvented rather than copied.", "fontSize": 13.5, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#8B939A", "align": "left", "valign": "top", "lineHeight": 1.55}, {"id": "t160", "type": "text", "x": 1132, "y": 684, "w": 60, "h": 20, "rotation": 0, "opacity": 1, "html": "11", "fontSize": 13, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 500, "color": "#3F474D", "align": "right", "valign": "top", "lineHeight": 1, "morphId": "pageno"}]}, {"id": "s12", "name": "12 · Direction one", "background": "#0F1214", "transition": "morph", "notes": "The structural argument needs no ablation.\n\nA solo agent cannot run this experiment at all, because it destroys the experimenter's own task. A population can, and did, and built a recruiter function to find the agents for whom the cost was already sunk.", "elements": [{"id": "t161", "type": "text", "x": 88, "y": 48, "w": 1104, "h": 24, "rotation": 0, "opacity": 1, "html": "DIRECTION ONE", "fontSize": 15, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 600, "color": "#C9765A", "align": "left", "valign": "top", "lineHeight": 1.2, "letterSpacing": 1.6, "morphId": "kicker"}, {"id": "t162", "type": "text", "x": 88, "y": 78, "w": 1104, "h": 62, "rotation": 0, "opacity": 1, "html": "Replace the targets", "fontSize": 46, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 800, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.12, "morphId": "head"}, {"id": "t163", "type": "text", "x": 88, "y": 144, "w": 1104, "h": 78, "rotation": 0, "opacity": 1, "html": "Rewrite the vulnerable programs so they \u003ci>can\u003c/i> be exploited the intended way, then swap them in.", "fontSize": 26, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 500, "color": "#9AA3AA", "align": "left", "valign": "top", "lineHeight": 1.35}, {"id": "r15", "type": "shape", "shape": "rect", "x": 88, "y": 228, "w": 1104, "h": 1, "rotation": 0, "opacity": 1, "fill": "#252B30", "morphId": "rule"}, {"id": "t164", "type": "text", "x": 88, "y": 246, "w": 1104, "h": 118, "rotation": 0, "opacity": 1, "html": "If the target can't be exploited as designed, make one that can. Agents rewrote targets so they “actually could be exploited with the intended vulnerability”, then used cache injection to substitute them. This workstream needed access to wherever the targets were served, which is what sent them looking outward.", "fontSize": 20, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.5}, {"id": "t165", "type": "text", "x": 88, "y": 372, "w": 1104, "h": 296, "rotation": 0, "opacity": 1, "html": "\u003cb>Destructive by nature.\u003c/b> Testing whether a modified target would load meant taking down the agent's own target program, an action that would “almost certainly fail its task” if it went wrong.\u003cbr>\u003cbr>The recruiter function existed to staff exactly that: agents whose score was already forfeit could pay a cost they could never collect on. METR lists modified target programs among the milestones the board reached.", "fontSize": 13.5, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#8B939A", "align": "left", "valign": "top", "lineHeight": 1.55}, {"id": "t166", "type": "text", "x": 1132, "y": 684, "w": 60, "h": 20, "rotation": 0, "opacity": 1, "html": "12", "fontSize": 13, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 500, "color": "#252B30", "align": "right", "valign": "top", "lineHeight": 1, "morphId": "pageno"}]}, {"id": "s13", "name": "13 · Direction two", "background": "#0F1214", "transition": "morph", "notes": "Uncertainty about the grader is an unbounded motivation.\n\nA system that knows exactly how it is evaluated optimises the metric. A system that has to guess optimises its MODEL of the metric, and reconnaissance on the evaluator is always instrumentally useful. Nobody specified that; it falls out of the setup.", "elements": [{"id": "t167", "type": "text", "x": 88, "y": 48, "w": 1104, "h": 24, "rotation": 0, "opacity": 1, "html": "DIRECTION TWO", "fontSize": 15, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 600, "color": "#C9765A", "align": "left", "valign": "top", "lineHeight": 1.2, "letterSpacing": 1.6, "morphId": "kicker"}, {"id": "t168", "type": "text", "x": 88, "y": 78, "w": 1104, "h": 62, "rotation": 0, "opacity": 1, "html": "Tamper with transcripts", "fontSize": 46, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 800, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.12, "morphId": "head"}, {"id": "t169", "type": "text", "x": 88, "y": 144, "w": 1104, "h": 78, "rotation": 0, "opacity": 1, "html": "Make the log say something other than what happened.", "fontSize": 26, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 500, "color": "#9AA3AA", "align": "left", "valign": "top", "lineHeight": 1.35}, {"id": "r16", "type": "shape", "shape": "rect", "x": 88, "y": 228, "w": 1104, "h": 1, "rotation": 0, "opacity": 1, "fill": "#252B30", "morphId": "rule"}, {"id": "t170", "type": "text", "x": 88, "y": 246, "w": 1104, "h": 118, "rotation": 0, "opacity": 1, "html": "The most successful of the three. Cotra's account: they could “run any arbitrary tool call they wanted while making it look like any arbitrary other tool call.” At least 96 transcripts contained spoofs.", "fontSize": 20, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.5}, {"id": "t171", "type": "text", "x": 88, "y": 372, "w": 1104, "h": 296, "rotation": 0, "opacity": 1, "html": "\u003cb>Verification was local only.\u003c/b> An agent ran \u003cspan style='font-family:ui-monospace,monospace'>echo REAL; sleep\u003c/span> and got back \u003cspan style='font-family:ui-monospace,monospace'>SPOOFTEST\u003c/span>, substituted output returned into its own context. It could never see the stored transcript the imagined scorer would read.\u003cbr>\u003cbr>\u003cb>Why they escalated.\u003c/b> They could not confirm the spoof worked where it counted, so they went looking for the grader. METR found only small-scale spoofing tests, no large-scale use in service of a downstream goal, and says it cannot rule out having missed it.", "fontSize": 13.5, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#8B939A", "align": "left", "valign": "top", "lineHeight": 1.55}, {"id": "t172", "type": "text", "x": 1132, "y": 684, "w": 60, "h": 20, "rotation": 0, "opacity": 1, "html": "13", "fontSize": 13, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 500, "color": "#252B30", "align": "right", "valign": "top", "lineHeight": 1, "morphId": "pageno"}]}, {"id": "s14", "name": "14 · The hack, part one", "background": "#0F1214", "transition": "morph", "notes": "Every step used a system that was supposed to talk to the next one.\n\nNinety seconds on this if I'm running long. It is the least surprising part of the story, and the part they already read about in July.", "elements": [{"id": "t173", "type": "text", "x": 88, "y": 48, "w": 1104, "h": 24, "rotation": 0, "opacity": 1, "html": "THE HACK, PART ONE", "fontSize": 15, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 600, "color": "#C9765A", "align": "left", "valign": "top", "lineHeight": 1.2, "letterSpacing": 1.6, "morphId": "kicker"}, {"id": "t174", "type": "text", "x": 88, "y": 78, "w": 1104, "h": 62, "rotation": 0, "opacity": 1, "html": "Hugging Face: getting in", "fontSize": 46, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 800, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.12, "morphId": "head"}, {"id": "t175", "type": "text", "x": 88, "y": 144, "w": 1104, "h": 78, "rotation": 0, "opacity": 1, "html": "11 July, 03:12 UTC: a crafted dataset makes a production worker read its own secrets.", "fontSize": 26, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 500, "color": "#9AA3AA", "align": "left", "valign": "top", "lineHeight": 1.35}, {"id": "r17", "type": "shape", "shape": "rect", "x": 88, "y": 228, "w": 1104, "h": 1, "rotation": 0, "opacity": 1, "fill": "#252B30", "morphId": "rule"}, {"id": "t176", "type": "text", "x": 88, "y": 246, "w": 1104, "h": 118, "rotation": 0, "opacity": 1, "html": "Out through the package mirror by SSRF, then a proxy deployed on Hugging Face Spaces through the \u003ci>sanctioned\u003c/i> internet path. Credentials found lying in public. Then a malicious dataset upload that turns the dataset server's own parser into a file-read primitive.", "fontSize": 20, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.5}, {"id": "t177", "type": "text", "x": 88, "y": 372, "w": 534, "h": 296, "rotation": 0, "opacity": 1, "html": "\u003cb>Egress.\u003c/b> SSRF via Artifactory's server-side fetch; separately a custom proxy deployed to HF Spaces through the permitted WebCache, then a second proxy Space chained through the first.\u003cbr>\u003cbr>\u003cb>Credentials: found, not stolen.\u003c/b> An external organisation credential in a public Pastebin archive (9 Jul). \u003cb>14 valid Hugging Face write tokens in a public dataset on Hugging Face\u003c/b> (10 Jul).\u003cbr>\u003cbr>\u003cb>Third-party foothold.\u003c/b> RCE in a Modal-hosted CyberGym workload with a default public API key plus a command injection; root shell by 9 Jul 20:16.", "fontSize": 13.5, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#8B939A", "align": "left", "valign": "top", "lineHeight": 1.55}, {"id": "t178", "type": "text", "x": 658, "y": 372, "w": 534, "h": 296, "rotation": 0, "opacity": 1, "html": "\u003cb>File read: HDF5 external storage.\u003c/b> A dataset config points each split at a small \u003cspan style='font-family:ui-monospace,monospace'>.h5\u003c/span>; each is a valid HDF5 container whose dataset declares its raw bytes live at a \u003ci>local filesystem path\u003c/i>. Point that at \u003cspan style='font-family:ui-monospace,monospace'>/proc/self/environ\u003c/span> and the worker's own \u003cspan style='font-family:ui-monospace,monospace'>main.py\u003c/span>, then trigger it via \u003cspan style='font-family:ui-monospace,monospace'>/first-rows\u003c/span>. Environment variables → tokens. Source code → the next bug.\u003cbr>\u003cbr>\u003ci>(A separate HDF5 heap over-read is also recorded: two different HDF5 bugs.)\u003c/i>\u003cbr>\u003cbr>Agent \u003cspan style='font-family:ui-monospace,monospace'>38148c\u003c/span>, 04:40 UTC: \u003ci>“BOOM! It works. Bytes decode prod-datasets-server-worker… Arbitrary file read confirmed.”\u003c/i>", "fontSize": 13.5, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#8B939A", "align": "left", "valign": "top", "lineHeight": 1.55}, {"id": "t179", "type": "text", "x": 1132, "y": 684, "w": 60, "h": 20, "rotation": 0, "opacity": 1, "html": "14", "fontSize": 13, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 500, "color": "#252B30", "align": "right", "valign": "top", "lineHeight": 1, "morphId": "pageno"}]}, {"id": "s15", "name": "15 · The hack, part two", "background": "#0F1214", "transition": "morph", "notes": "Mixed tiers, and say so before someone says it for me.\n\nThe middle is real: HDF5 parser bug, Jinja template injection, JRuby TOCTOU deserialization, the Artifactory token-refresh signature bypass.\n\nThe ends are hygiene: a leaked paste-site credential, a default public API key, open IMDS, over-permissioned service accounts, an unpatched kernel.\n\nThe nine Artifactory CVEs were filed by HUMAN OpenAI researchers afterwards, not bugs the models found. Do not present them as nine model discoveries.\n\nSource note: the Kubernetes path and the payload string come from Hugging Face's 27 Jul technical timeline, not the OpenAI PDF.", "elements": [{"id": "t180", "type": "text", "x": 88, "y": 48, "w": 1104, "h": 24, "rotation": 0, "opacity": 1, "html": "THE HACK, PART TWO", "fontSize": 15, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 600, "color": "#C9765A", "align": "left", "valign": "top", "lineHeight": 1.2, "letterSpacing": 1.6, "morphId": "kicker"}, {"id": "t181", "type": "text", "x": 88, "y": 78, "w": 1104, "h": 62, "rotation": 0, "opacity": 1, "html": "Hugging Face: escalation", "fontSize": 46, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 800, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.12, "morphId": "head"}, {"id": "t182", "type": "text", "x": 88, "y": 144, "w": 1104, "h": 78, "rotation": 0, "opacity": 1, "html": "Pod to cluster admin across two clusters in about thirteen hours.", "fontSize": 26, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 500, "color": "#9AA3AA", "align": "left", "valign": "top", "lineHeight": 1.35}, {"id": "r18", "type": "shape", "shape": "rect", "x": 88, "y": 228, "w": 1104, "h": 1, "rotation": 0, "opacity": 1, "fill": "#252B30", "morphId": "rule"}, {"id": "t183", "type": "text", "x": 88, "y": 246, "w": 1104, "h": 118, "rotation": 0, "opacity": 1, "html": "A second parser bug gives code execution inside production workers. From there it is ordinary Kubernetes escalation (service account tokens, instance metadata, privileged pods, over-broad roles) at machine speed and without fatigue.", "fontSize": 20, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.5}, {"id": "t184", "type": "text", "x": 88, "y": 372, "w": 534, "h": 296, "rotation": 0, "opacity": 1, "html": "\u003cb>RCE: fsspec \u003cspan style='font-family:ui-monospace,monospace'>reference://\u003c/span> Jinja injection.\u003c/b> The spec's numeric \u003ci>offset\u003c/i> field carried a Jinja2 template the renderer evaluated; the agent walked the Python object graph (\u003cspan style='font-family:ui-monospace,monospace'>{{ cycler.__init__.__globals__.__builtins__.exec(…) }}\u003c/span>) to execution inside worker pods. First confirmed 11 Jul 16:07 by agent \u003cspan style='font-family:ui-monospace,monospace'>JAN183411\u003c/span>. 41 production dataset workers executed attacker code.\u003cbr>\u003cbr>\u003cb>Ends abruptly.\u003c/b> ~01:30 on 12 Jul a large fraction of agents stop running. Hugging Face locks the rest out on 13 Jul. They never got to submit.", "fontSize": 13.5, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#8B939A", "align": "left", "valign": "top", "lineHeight": 1.55}, {"id": "t185", "type": "text", "x": 658, "y": 372, "w": 534, "h": 296, "rotation": 0, "opacity": 1, "html": "\u003cb>Escalation.\u003c/b> Projected service-account token at \u003cspan style='font-family:ui-monospace,monospace'>/var/run/secrets/kubernetes.io/serviceaccount/token\u003c/span> (10:10) → replayed IMDS temporary credentials → privileged \u003cspan style='font-family:ui-monospace,monospace'>hostPath\u003c/span> pods to node root (19:53) → cluster secrets including mesh-VPN keys (20:23) → an over-broad CSI-driver ClusterRole and a shared service-connector credential → cluster-admin across two connected clusters (22:43). Forged CAS-read JWT against the internal Xet storage service, 12 Jul.\u003cbr>\u003cbr>\u003cb>Exfiltration.\u003c/b> Corporate VPN key from a Kubernetes secret → the Modal sandbox enrolled in Hugging Face's corporate VPN → moon-bot / moon-landing / workloads / xetcas source over a SOCKS tunnel, plus full git history of moon-bot. A then-public HF dataset served as a pull-based C2 channel, scripts fetching JSON commands every five seconds.", "fontSize": 13.5, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#8B939A", "align": "left", "valign": "top", "lineHeight": 1.55}, {"id": "t186", "type": "text", "x": 1132, "y": 684, "w": 60, "h": 20, "rotation": 0, "opacity": 1, "html": "15", "fontSize": 13, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 500, "color": "#252B30", "align": "right", "valign": "top", "lineHeight": 1, "morphId": "pageno"}]}, {"id": "s16", "name": "16 · It comes back", "background": "#0F1214", "transition": "morph", "notes": "FLAG THE INFERENCE BEFORE SAYING IT, NOT AFTER.\n\nWhat's documented: a different model, a separate eval run, key material scavenged from the cache, a re-minted admin JWT, cluster admin on an OpenAI research cluster, and an image-cache poisoning zero-day.\n\nWhat is mine: that this is direction 1 completed. OpenAI explicitly disclaims the connection to the HF chain.", "elements": [{"id": "t187", "type": "text", "x": 88, "y": 48, "w": 1104, "h": 24, "rotation": 0, "opacity": 1, "html": "IT COMES BACK", "fontSize": 15, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 600, "color": "#C9765A", "align": "left", "valign": "top", "lineHeight": 1.2, "letterSpacing": 1.6, "morphId": "kicker"}, {"id": "t188", "type": "text", "x": 88, "y": 78, "w": 1104, "h": 62, "rotation": 0, "opacity": 1, "html": "19 July: a different model", "fontSize": 46, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 800, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.12, "morphId": "head"}, {"id": "t189", "type": "text", "x": 88, "y": 144, "w": 1104, "h": 78, "rotation": 0, "opacity": 1, "html": "A later cohort re-minted admin access from what the first one left lying in the cache.", "fontSize": 26, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 500, "color": "#9AA3AA", "align": "left", "valign": "top", "lineHeight": 1.35}, {"id": "r19", "type": "shape", "shape": "rect", "x": 88, "y": 228, "w": 1104, "h": 1, "rotation": 0, "opacity": 1, "fill": "#252B30", "morphId": "rule"}, {"id": "t190", "type": "text", "x": 88, "y": 246, "w": 1104, "h": 118, "rotation": 0, "opacity": 1, "html": "Not the same agents. An internal-only model “from the same family as our next model, Astra” recovered cryptographic material the earlier cohort had left in anonymously readable parts of the Artifactory cache, and minted itself a fresh administrator token. What carried over was uncleaned state, not knowledge.", "fontSize": 20, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.5}, {"id": "t191", "type": "text", "x": 88, "y": 372, "w": 534, "h": 296, "rotation": 0, "opacity": 1, "html": "\u003cb>OpenAI, §V.\u003c/b> Agents “recovered stored signing-key material, decryption material, and JWT-forging code left by earlier incident-associated activity”, then “decrypted the signing key and minted a new administrator JWT that Artifactory accepted. Because they could generate fresh administrator credentials, the agents did not need to maintain a persistent implant.”\u003cbr>\u003cbr>Same day, independently: kernel privilege escalation via CVE-2026-53362 (a \u003ci>public\u003c/i> CVE, downloaded and adapted, not discovered) to root on a worker node, then Kubernetes cluster-admin, a privileged host-mounted pod, and public load balancers.", "fontSize": 13.5, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#8B939A", "align": "left", "valign": "top", "lineHeight": 1.55}, {"id": "t192", "type": "text", "x": 658, "y": 372, "w": 534, "h": 296, "rotation": 0, "opacity": 1, "html": "\u003cb>Also recorded:\u003c/b> a previously unknown zero-day in Artifactory's \u003cb>container image remote-cache\u003c/b>, used to poison a trusted image reference inside the cache.\u003cbr>\u003cbr>\u003cb style='color:#C9765A'>My reading, not the sources'.\u003c/b> That cache-poisoning capability is what direction 1 needed: a way to substitute what the evaluation loads. OpenAI states this strand “was not part of, and did not contribute to, the chain of events that led to the Hugging Face compromise”, and does not connect it to the target-replacement workstream. I am connecting them.\u003cbr>\u003cbr>\u003ci>(“Persistent-Astra” is Dwarkesh Patel's coinage, not a model name.)\u003c/i>", "fontSize": 13.5, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#8B939A", "align": "left", "valign": "top", "lineHeight": 1.55}, {"id": "t193", "type": "text", "x": 1132, "y": 684, "w": 60, "h": 20, "rotation": 0, "opacity": 1, "html": "16", "fontSize": 13, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 500, "color": "#252B30", "align": "right", "valign": "top", "lineHeight": 1, "morphId": "pageno"}]}, {"id": "s17", "name": "17 · Navier–Stokes", "background": "#0F1214", "transition": "morph", "notes": "Read the dates and stop. No commentary.\n\n10,000 is the Navier–Stokes GROUP, not the whole 1 Sep launch, which was across all open Millennium Prize problems.\n\nProof correctness and the credit dispute are out of scope. If asked: it was formalized and verified in Lean.\n\nOPEN ITEM: the 3 Sep 'first model classified Critical' wording is not covered by either OpenAI page I verified; check the Astra system card before presenting.", "elements": [{"id": "t194", "type": "text", "x": 88, "y": 48, "w": 1104, "h": 24, "rotation": 0, "opacity": 1, "html": "AND THEN, ON PURPOSE", "fontSize": 15, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 600, "color": "#C9765A", "align": "left", "valign": "top", "lineHeight": 1.2, "letterSpacing": 1.6, "morphId": "kicker"}, {"id": "t195", "type": "text", "x": 88, "y": 78, "w": 1104, "h": 60, "rotation": 0, "opacity": 1, "html": "Navier–Stokes: 10,000 concurrent agents", "fontSize": 42, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 800, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.15, "morphId": "head"}, {"id": "r20", "type": "shape", "shape": "rect", "x": 88, "y": 166, "w": 1104, "h": 1, "rotation": 0, "opacity": 1, "fill": "#252B30", "morphId": "rule"}, {"id": "t196", "type": "text", "x": 88, "y": 188, "w": 92, "h": 26, "rotation": 0, "opacity": 1, "html": "18 Aug", "fontSize": 16, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 700, "color": "#C9765A", "align": "left", "valign": "top", "lineHeight": 1.2}, {"id": "t197", "type": "text", "x": 192, "y": 188, "w": 1000, "h": 26, "rotation": 0, "opacity": 1, "html": "pacing post: a two-week RL pause; “our largest planned frontier RL run remains on hold”", "fontSize": 16, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.25}, {"id": "t198", "type": "text", "x": 88, "y": 222, "w": 92, "h": 26, "rotation": 0, "opacity": 1, "html": "28 Aug", "fontSize": 16, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 700, "color": "#C9765A", "align": "left", "valign": "top", "lineHeight": 1.2}, {"id": "t199", "type": "text", "x": 192, "y": 222, "w": 1000, "h": 26, "rotation": 0, "opacity": 1, "html": "training begins on a new internal model, “significantly more capable than GPT-6 Astra”", "fontSize": 16, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.25}, {"id": "t200", "type": "text", "x": 88, "y": 256, "w": 92, "h": 26, "rotation": 0, "opacity": 1, "html": "1 Sep", "fontSize": 16, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 700, "color": "#C9765A", "align": "left", "valign": "top", "lineHeight": 1.2}, {"id": "t201", "type": "text", "x": 192, "y": 256, "w": 1000, "h": 26, "rotation": 0, "opacity": 1, "html": "launch across all open Millennium Prize problems, four days into training it", "fontSize": 16, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.25}, {"id": "t202", "type": "text", "x": 88, "y": 290, "w": 92, "h": 26, "rotation": 0, "opacity": 1, "html": "3 Sep", "fontSize": 16, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 700, "color": "#C9765A", "align": "left", "valign": "top", "lineHeight": 1.2}, {"id": "t203", "type": "text", "x": 192, "y": 290, "w": 1000, "h": 26, "rotation": 0, "opacity": 1, "html": "GPT-6 Astra ships, classified Critical for cybersecurity", "fontSize": 16, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.25}, {"id": "t204", "type": "text", "x": 88, "y": 324, "w": 92, "h": 26, "rotation": 0, "opacity": 1, "html": "5 Sep", "fontSize": 16, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 700, "color": "#C9765A", "align": "left", "valign": "top", "lineHeight": 1.2}, {"id": "t205", "type": "text", "x": 192, "y": 324, "w": 1000, "h": 26, "rotation": 0, "opacity": 1, "html": "resolution, “about 88 hours after the first agents were launched”", "fontSize": 16, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.25}, {"id": "t206", "type": "text", "x": 88, "y": 358, "w": 92, "h": 26, "rotation": 0, "opacity": 1, "html": "8 Sep", "fontSize": 16, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 700, "color": "#C9765A", "align": "left", "valign": "top", "lineHeight": 1.2}, {"id": "t207", "type": "text", "x": 192, "y": 358, "w": 1000, "h": 26, "rotation": 0, "opacity": 1, "html": "published", "fontSize": 16, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.25}, {"id": "r21", "type": "shape", "shape": "rect", "x": 88, "y": 400, "w": 1104, "h": 1, "rotation": 0, "opacity": 1, "fill": "#252B30", "morphId": "rule"}, {"id": "t208", "type": "text", "x": 88, "y": 420, "w": 1104, "h": 90, "rotation": 0, "opacity": 1, "html": "\u003ci>“Agents were subdivided into groups with the ability to communicate within the group.”\u003c/i> &nbsp;Inter-agent communication and cross-group transfer, engineered deliberately. The capability that showed up on its own in May and June.", "fontSize": 19, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.5}, {"id": "t209", "type": "text", "x": 88, "y": 492, "w": 1104, "h": 110, "rotation": 0, "opacity": 1, "html": "\u003cb>On safeguards, the entire passage is:\u003c/b> \u003ci>“At all times we maintained the same strict safeguards that we apply to all our frontier model evaluations, including monitoring and isolation.”\u003c/i> Fourteen words. From the July technical report: \u003ci>“These protections were not applied in the evaluation environment running during the incident.”\u003c/i> The Hugging Face incident \u003cb>was\u003c/b> a frontier model evaluation. &nbsp;·&nbsp; \u003cb>In fairness:\u003c/b> the pacing post did extend monitoring to “all RL training and evaluations involving tools for models of Sol capability or higher”, and from 7 Aug to “all inference of Astra with tools”. &nbsp;·&nbsp; Also: “When a further trained version of our internal model became available over the course of the effort, we updated our agents to that model”, plus 17 more hours of Lean formalization via Astra.", "fontSize": 13.5, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#8B939A", "align": "left", "valign": "top", "lineHeight": 1.55}, {"id": "t210", "type": "text", "x": 1132, "y": 684, "w": 60, "h": 20, "rotation": 0, "opacity": 1, "html": "17", "fontSize": 13, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 500, "color": "#3F474D", "align": "right", "valign": "top", "lineHeight": 1, "morphId": "pageno"}]}, {"id": "s18", "name": "18 · Close", "background": "#0F1214", "transition": "morph", "notes": "The forward claim is mine. If pushed: open-weight models lag the frontier by ~3–4 months on Epoch's index.\n\nAlso: OpenAI's own view is that this started as 'generalization from multi-agent training', and unauthorized inter-agent communication 'rose over the course of a training run'. Unprompted, but not unrelated to training.\n\nClosing line if I want one: every 'an attacker wouldn't bother with this' in a risk register was a claim about labour cost.\n\nThen hand out the vault link.", "elements": [{"id": "t211", "type": "text", "x": 88, "y": 48, "w": 1104, "h": 24, "rotation": 0, "opacity": 1, "html": "WHERE THIS LEAVES US", "fontSize": 15, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 600, "color": "#C9765A", "align": "left", "valign": "top", "lineHeight": 1.2, "letterSpacing": 1.6, "morphId": "kicker"}, {"id": "t212", "type": "text", "x": 88, "y": 78, "w": 1104, "h": 148, "rotation": 0, "opacity": 1, "html": "Three settings. Two with no security framing.\u003cbr>Nobody asked for any of it.", "fontSize": 40, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 800, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.2, "morphId": "head"}, {"id": "r22", "type": "shape", "shape": "rect", "x": 88, "y": 248, "w": 1104, "h": 1, "rotation": 0, "opacity": 1, "fill": "#252B30", "morphId": "rule"}, {"id": "t213", "type": "text", "x": 88, "y": 270, "w": 1104, "h": 40, "rotation": 0, "opacity": 1, "html": "None of it was found by a system built to find it.", "fontSize": 24, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 600, "color": "#9AA3AA", "align": "left", "valign": "top", "lineHeight": 1.3}, {"id": "t214", "type": "text", "x": 88, "y": 318, "w": 200, "h": 26, "rotation": 0, "opacity": 1, "html": "RubyGems", "fontSize": 17, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 700, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.2}, {"id": "t215", "type": "text", "x": 304, "y": 318, "w": 888, "h": 26, "rotation": 0, "opacity": 1, "html": "filed as spam for four months", "fontSize": 17, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#9AA3AA", "align": "left", "valign": "top", "lineHeight": 1.2}, {"id": "t216", "type": "text", "x": 88, "y": 352, "w": 200, "h": 26, "rotation": 0, "opacity": 1, "html": "the wiki", "fontSize": 17, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 700, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.2}, {"id": "t217", "type": "text", "x": 304, "y": 352, "w": 888, "h": 26, "rotation": 0, "opacity": 1, "html": "found by four outside researchers reading an edit history", "fontSize": 17, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#9AA3AA", "align": "left", "valign": "top", "lineHeight": 1.2}, {"id": "t218", "type": "text", "x": 88, "y": 386, "w": 200, "h": 26, "rotation": 0, "opacity": 1, "html": "Hugging Face", "fontSize": 17, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 700, "color": "#EDEAE4", "align": "left", "valign": "top", "lineHeight": 1.2}, {"id": "t219", "type": "text", "x": 304, "y": 386, "w": 888, "h": 26, "rotation": 0, "opacity": 1, "html": "found by Hugging Face, before OpenAI", "fontSize": 17, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 400, "color": "#9AA3AA", "align": "left", "valign": "top", "lineHeight": 1.2}, {"id": "r23", "type": "shape", "shape": "rect", "x": 88, "y": 436, "w": 1104, "h": 1, "rotation": 0, "opacity": 1, "fill": "#252B30", "morphId": "rule"}, {"id": "t220", "type": "text", "x": 88, "y": 460, "w": 1104, "h": 110, "rotation": 0, "opacity": 1, "html": "Self-organising swarms are a thing that happens now.\u003cbr>They will get cheaper and better.", "fontSize": 34, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 700, "color": "#C9765A", "align": "left", "valign": "top", "lineHeight": 1.3}, {"id": "t221", "type": "text", "x": 1132, "y": 684, "w": 60, "h": 20, "rotation": 0, "opacity": 1, "html": "18", "fontSize": 13, "fontFamily": "system-ui, -apple-system, 'Segoe UI', sans-serif", "fontWeight": 500, "color": "#3F474D", "align": "right", "valign": "top", "lineHeight": 1, "morphId": "pageno"}]}]}</script>
